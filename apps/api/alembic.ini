# Alembic configuration for Orbit API.
#
# The script_location points to the alembic/ directory.
# The URL is intentionally left blank here: env.py reads
# DATABASE_URL from the application's settings.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Do NOT set sqlalchemy.url here. env.py reads it from
# app.config.get_settings().database_url.

[post_write_hooks]
# Reserved for future formatting hooks.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
